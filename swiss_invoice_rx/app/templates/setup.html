{% extends 'base.html' %}{% block title %}Ersteinrichtung{% endblock %}{% block authcontent %}<div class="auth-box"><span class="eyebrow">ERSTEINRICHTUNG</span><h1>Geschäft einrichten</h1><p>Administratorkonto und erstes Geschäft anlegen. Die Daten werden lokal gespeichert.</p><form action="{{ ingress_prefix }}/setup" method="post"><input type="hidden" name="_csrf" value="{{ csrf }}"><div class="field"><label>Geschäftsname</label><input name="company_name" required placeholder="Muster GmbH"></div><div class="field"><label>Name der verantwortlichen Person</label><input name="full_name" required placeholder="Vorname Nachname"></div><div class="field"><label>E-Mail</label><input name="email" type="email" required placeholder="name@firma.ch"></div><div class="field"><label>Passwort · mindestens 10 Zeichen</label><input type="password" minlength="10" name="password" required></div><div class="field"><label>Passwort wiederholen</label><input type="password" minlength="10" name="password2" required></div><button class="btn btn-primary btn-block">Geschäft einrichten →</button></form><div class="auth-caption">Einrichtung funktioniert vollständig ohne Internet.</div></div>{% endblock %}
