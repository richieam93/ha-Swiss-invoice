{% extends 'base.html' %}{% block title %}Anmelden{% endblock %}{% block authcontent %}<div class="auth-box"><span class="eyebrow">WILLKOMMEN ZURÜCK</span><h1>Schön, dass du da bist.</h1><p>Melde dich an, um deine Rechnungen und Geschäftsdaten zu verwalten.</p><form method="post" action="{{ ingress_prefix }}/login"><input type="hidden" name="_csrf" value="{{ csrf }}"><div class="field"><label>E-Mail-Adresse</label><input type="email" name="email" autocomplete="username" required autofocus placeholder="name@firma.ch"></div><div class="field"><label>Passwort</label><input type="password" name="password" autocomplete="current-password" required></div><button class="btn btn-primary btn-block">Sicher anmelden →</button></form><div class="auth-caption">Deine Daten bleiben auf diesem Computer gespeichert.</div></div>{% endblock %}
